# Typechecks, then builds the portal's image and pushes it to ghcr.io/<owner>/<repo>, tagged with
# the commit and, on main, `latest`. The server pulls it (README.md, "Upgrade it").
name: Build
on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  # Only a change to what goes in the image: notes alone build nothing.
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_dispatch:

concurrency:
  # A pull request's older build is dropped. Each commit on main has a group of its own, so none is ever
  # dropped or replaced: the server runs a commit's image by its tag.
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn tsc
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}:latest', github.repository) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The tag to run
        if: github.ref == 'refs/heads/main'
        run: echo "Set BACKSTAGE_VERSION=${GITHUB_SHA} in the portal's .env to run this build." >> "$GITHUB_STEP_SUMMARY"
