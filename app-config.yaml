# Local development: `yarn start`, signed in as a guest, reading AUGUR's catalog from GitHub.
# app-config.production.yaml adds what the server needs on top of this.
app:
  title: Backstage
  baseUrl: http://localhost:3000
  packages: all
  extensions:
    # AUGUR's dark theme only (packages/app/src/modules/augur/theme.ts).
    - theme:app/light: false
    - theme:app/dark: false
    - page:catalog:
        config:
          path: /
    - home-page-widget:home/toolkit:
        config:
          tools:
            - url: https://github.com/harry-burton-dev/im-platform
              label: AUGUR on GitHub
              icon: github
            - url: https://github.com/harry-burton-dev/im-platform/actions
              label: AUGUR's CI
              icon: github
            - url: https://linear.app
              label: Linear
              icon: docs
            - url: https://backstage.io/docs
              label: Backstage docs
              icon: docs

organization:
  name: Harry Burton

backend:
  baseUrl: http://localhost:7007
  listen:
    port: 7007
  csp:
    connect-src: ["'self'", 'http:', 'https:']
  cors:
    origin: http://localhost:3000
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true
  database:
    client: better-sqlite3
    connection: ':memory:'

integrations:
  github:
    - host: github.com
      # Read-only: Contents read on the repositories in the catalog (README.md).
      token: ${GITHUB_TOKEN}

techdocs:
  builder: local
  generator:
    runIn: docker
  publisher:
    type: local

auth:
  providers:
    guest: {}

catalog:
  rules:
    - allow: [Domain, System, Component, API, Resource, Location, Group, User, Template]
  locations:
    # The company's people and teams.
    - type: file
      target: ../../org/org.yaml
    # AUGUR, as AUGUR describes itself (pnpm catalog in im-platform), from dev: where work lands.
    - type: url
      target: https://github.com/harry-burton-dev/im-platform/blob/dev/catalog/all.yaml

permission:
  enabled: true
