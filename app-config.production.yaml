# On the server (deploy/compose.yml). Every ${…} comes from deploy/.env.
app:
  baseUrl: ${BACKSTAGE_URL}

backend:
  baseUrl: ${BACKSTAGE_URL}
  listen: ':7007'
  cors:
    origin: ${BACKSTAGE_URL}
  database:
    client: pg
    connection:
      host: postgres
      port: 5432
      user: backstage
      password: ${POSTGRES_PASSWORD}

auth:
  environment: production
  session:
    secret: ${AUTH_SESSION_SECRET}
  providers:
    # Signed in through Keycloak: the workbench AUGUR's realm for now (docs: README.md, "Sign-in").
    oidc:
      production:
        metadataUrl: ${OIDC_METADATA_URL}
        clientId: ${OIDC_CLIENT_ID}
        clientSecret: ${OIDC_CLIENT_SECRET}
        prompt: auto
        signIn:
          resolvers:
            - resolver: emailLocalPartMatchingUserEntityName
              dangerouslyAllowSignInWithoutUserInCatalog: true

techdocs:
  builder: local
  generator:
    # MkDocs and techdocs-core are in the image (Dockerfile), so no Docker socket is needed.
    runIn: local
  publisher:
    type: local
    local:
      publishDirectory: /app/techdocs

catalog:
  locations:
    - type: file
      target: ./org/org.yaml
    # Each AUGUR deployment, for its card (packages/app/src/modules/augur/pipeline.tsx).
    - type: file
      target: ./org/deployments.yaml
    - type: url
      target: https://github.com/harry-burton-dev/augur/blob/main/catalog/all.yaml

augur:
  # The dead-man alert for AUGUR deployments (README.md, "Late reports").
  lateReports:
    notify: ${LATE_REPORTS_NOTIFY}
